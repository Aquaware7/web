<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <!-- FullCalendar 核心樣式與腳本 (使用 CDN) -->
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.css' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
    <!-- Thunkable Webviewer 專用橋接腳本，讓網頁可以與 App 雙向通訊 -->
    <script src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js" type="text/javascript"></script>
    <style>
        /* 簡單的響應式調整，讓月曆在手機上更好看 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #calendar {
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id='calendar'></div>

    <script>
        // 宣告一個全域變數 calendar，讓後續的函數都能存取
        var calendar;

        // 當頁面載入完成後初始化 FullCalendar
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');

            calendar = new FullCalendar.Calendar(calendarEl, {
                // 基本設定
                initialView: 'dayGridMonth',       // 預設顯示月檢視
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                locale: 'zh-tw',                    // 繁體中文介面
                firstDay: 1,                         // 每週從週一開始 (0=週日, 1=週一)
                height: 'auto',                       // 自動高度，適應手機畫面
                // 點擊日期事件 (會傳送資料給 Thunkable App)
                dateClick: function(info) {
                    console.log('點擊了日期: ' + info.dateStr);
                    // 使用 Thunkable 提供的橋接，將日期傳送給 App
                    if (window.ThunkableWebviewerExtension) {
                        window.ThunkableWebviewerExtension.postMessage({
                            type: 'dateClick',        // 自訂的訊息類型，方便 App 判別
                            date: info.dateStr
                        });
                    } else {
                        // 如果在瀏覽器直接測試，可以改用 alert 或改變網址 hash
                        alert('點擊日期：' + info.dateStr);
                    }
                },
                // 預設顯示的事件 (可以從這裡開始，之後改由資料庫提供)
                events: [
                    { title: '📅 開始專案', start: '2026-03-10' },
                    { title: '💡 會議', start: '2026-03-15' },
                    { title: '📝 繳交報告', start: '2026-03-20' }
                ]
            });

            calendar.render();  // 渲染月曆
        });

        /**
         * 接收來自 Thunkable App 的訊息 (由 App 的「呼叫 Javascript 函數」積木觸發)
         * 參數 message: 從 App 傳來的字串 (通常是 JSON 格式)
         */
        window.receiveMessageFromApp = function(message) {
            console.log('收到來自 App 的訊息:', message);

            // 嘗試將傳入的字串解析為 JSON 物件
            try {
                var data = JSON.parse(message);
                
                // 根據 action 欄位決定要做什麼
                if (data.action === 'addEvent') {
                    // 新增行程到月曆
                    calendar.addEvent({
                        title: data.title,
                        start: data.date,
                        allDay: true   // 設為全天事件，可依需求調整
                    });
                    
                    // 可以回傳一個確認訊息給 App (選擇性)
                    if (window.ThunkableWebviewerExtension) {
                        window.ThunkableWebviewerExtension.postMessage({
                            type: 'addEventResult',
                            success: true,
                            message: '行程已新增'
                        });
                    }
                } else {
                    console.warn('未知的 action:', data.action);
                }
            } catch (e) {
                console.error('解析 App 訊息失敗:', e);
                // 可將錯誤回傳給 App
                if (window.ThunkableWebviewerExtension) {
                    window.ThunkableWebviewerExtension.postMessage({
                        type: 'error',
                        message: '無法解析訊息'
                    });
                }
            }
        };

        // 額外補充：如果想在網頁端手動新增測試事件，可以用下面的方式 (直接在瀏覽器開發者工具呼叫)
        // window.receiveMessageFromApp('{"action":"addEvent","title":"測試行程","date":"2026-03-28"}');
    </script>
</body>
</html>
