<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.css' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
    <script src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: system-ui; background: #f5f5f5; }
        #calendar { max-width: 100%; margin: 0 auto; padding: 10px; background: white; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .loading { text-align: center; padding: 20px; color: gray; }
    </style>
</head>
<body>
    <div id='calendar'></div>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw01HM8-PAZB7GuWS9bXMF9vBs5-50iDcuOYxxNZC8XeK1mqPEzTZziOeYQUldJJuNn/exec";  // 🔁 請替換成你的 Apps Script 網址
        let calendar;

        // 從 Google Sheets 載入行程
        async function loadEventsFromAPI() {
            try {
                const response = await fetch(API_URL);
                const events = await response.json();
                // 轉換成 FullCalendar 需要的格式
                return events.map(ev => ({
                    id: ev.id,
                    title: ev.title,
                    start: ev.date,
                    allDay: true,
                    description: ev.description || ""
                }));
            } catch (err) {
                console.error("載入失敗", err);
                return [];
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const calendarEl = document.getElementById('calendar');
            // 先顯示載入中
            calendarEl.innerHTML = '<div class="loading">載入行事曆中...</div>';
            
            const initialEvents = await loadEventsFromAPI();
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                locale: 'zh-tw',
                firstDay: 1,
                height: 'auto',
                events: initialEvents,
                // 點擊日期
                dateClick: function(info) {
                    if (window.ThunkableWebviewerExtension) {
                        window.ThunkableWebviewerExtension.postMessage({
                            type: 'dateClick',
                            date: info.dateStr
                        });
                    }
                },
                // 點擊行程（編輯/刪除）
                eventClick: function(info) {
                    if (window.ThunkableWebviewerExtension) {
                        window.ThunkableWebviewerExtension.postMessage({
                            type: 'eventClick',
                            id: info.event.id,
                            title: info.event.title,
                            date: info.event.startStr,
                            description: info.event.extendedProps.description || ""
                        });
                    }
                }
            });
            calendar.render();
        });

        // 接收來自 Thunkable App 的指令
        window.receiveMessageFromApp = async function(message) {
            try {
                const data = JSON.parse(message);
                if (data.action === 'addEvent') {
                    // 1. 呼叫 API 新增
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors', // 注意：no-cors 會讓 response 無法讀取，改用 cors 但需 Apps Script 支援
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'add',
                            title: data.title,
                            date: data.date,
                            description: data.description || ""
                        })
                    });
                    // 2. 重新載入行程並更新月曆
                    const newEvents = await loadEventsFromAPI();
                    calendar.removeAllEvents();
                    calendar.addEventSource(newEvents);
                    // 3. 回傳成功訊息給 App
                    if (window.ThunkableWebviewerExtension) {
                        window.ThunkableWebviewerExtension.postMessage({
                            type: 'addEventResult',
                            success: true
                        });
                    }
                }
                else if (data.action === 'updateEvent') {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'update',
                            id: data.id,
                            title: data.title,
                            date: data.date,
                            description: data.description
                        })
                    });
                    const newEvents = await loadEventsFromAPI();
                    calendar.removeAllEvents();
                    calendar.addEventSource(newEvents);
                    if (window.ThunkableWebviewerExtension) {
                        window.ThunkableWebviewerExtension.postMessage({
                            type: 'updateEventResult',
                            success: true
                        });
                    }
                }
                else if (data.action === 'deleteEvent') {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'delete',
                            id: data.id
                        })
                    });
                    const newEvents = await loadEventsFromAPI();
                    calendar.removeAllEvents();
                    calendar.addEventSource(newEvents);
                    if (window.ThunkableWebviewerExtension) {
                        window.ThunkableWebviewerExtension.postMessage({
                            type: 'deleteEventResult',
                            success: true
                        });
                    }
                }
            } catch(err) {
                console.error(err);
                if (window.ThunkableWebviewerExtension) {
                    window.ThunkableWebviewerExtension.postMessage({
                        type: 'error',
                        message: err.message
                    });
                }
            }
        };
    </script>
</body>
</html>
